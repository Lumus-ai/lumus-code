details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}

.chip.btnlike{cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:9px 16px;border-radius:12px;z-index:20;box-shadow:var(--sh)}
.errc{border:1px solid var(--bad);border-radius:14px;padding:11px 14px;color:var(--bad);margin:8px 0;background:var(--card)}

.noanim *{animation:none!important;transition:none!important}
.chip.run i{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.25}}
.mini{width:100%;margin-top:6px}
.dbody input[type=text],.dbody input[type=number],.dbody select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}

.sh{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 4px;font-weight:600}
.pmsg{margin-top:6px;color:var(--bad);word-break:break-word}.pmsg.okm{color:#4ade80}
.dbody input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px;font:inherit}
.scrim{display:none}
.rr>div:last-child{flex:1;min-width:0}

 .app{grid-template-columns:1fr}
}

<script>
const PH={"need-brain":"ждём мозг","need-hands":"ждём руки","need-test":"ждём тесты"};
const TR=[[/^PASSED in round (\d+)$/,"Тесты прошли в раунде $1"],[/^STOPPED: tests still failing after (\d+) rounds$/,"Остановлено: тесты всё ещё падают после $1 раундов"],
[/^loop ready in (.*)$/,"цикл создан в $1"],[/^task and test command are required$/,"нужны задача и команда тестов"],[/^project folder does not exist: (.*)$/,"папки проекта нет: $1"],
[/^a step is running$/,"сейчас выполняется шаг, подожди"],[/^forbidden$/,"запрещено"],[/^bad json$/,"неверный запрос"],[/^ERROR: no loop here; run init first$|^no loop here; run init first$/,"цикл ещё не создан"],
[/^loop already finished: (.*)$/,"цикл уже завершён: $1"],[/^REJECTED: (.*?)(\n|$)[\s\S]*/,"Ответ отклонён: $1. Попроси мозг ответить в нужном формате (PLAN, HANDS TASK, STATUS)."],
[/^round (\d+): asking the brain \((.*)\)…$/,"раунд $1: спрашиваем мозг ($2)…"],[/^round (\d+): hands are writing code…$/,"раунд $1: руки пишут код…"],[/^round (\d+): running tests…$/,"раунд $1: запускаем тесты…"],
[/^hands wrote: (.*)$/,"руки записали файлы: $1"],[/^TEST PASS.*$/,"тесты прошли"],[/^TEST FAIL \(exit (\d+)\).*$/,"тесты упали (код $1), следующий раунд"],
[/^brain reply accepted.*$/,"ответ мозга принят"],[/^denied by user$/,"Действие отклонено: тесты не запускались"],[/^denied: .*$/,"отклонено: команда тестов не запущена"],[/^waiting for your confirmation$/,"ждём твоего подтверждения"],[/^stopped after the current step$/,"остановлено после текущего шага"],[/^stopped: (.*)$/,"остановлено: $1"],[/^error: (.*)$/,"ошибка: $1"],
[/^ERROR: chat input not found.*$/,"Не найдено поле ввода чата (нет входа, капча или страница изменилась). Проверь окно Chrome или используй ручной режим."],
[/^ERROR: cannot reach Chrome on (.*?) .*$/,"Chrome не отвечает на $1. Запусти: lumus-demo chrome"],

[/^ERROR: prompt is (\d+) chars.*$/,"Запрос слишком длинный ($1 символов, предел 40000). Сократи задачу или файлы."],
[/^ERROR: the page showed an error instead of an answer: (.*?);.*$/,"Страница вернула ошибку вместо ответа: $1. Повтори позже или используй ручной режим."],
[/^ERROR: model API HTTP (\d+)$/,"API рук вернул ошибку HTTP $1 (проверь ключ, модель и лимиты)"],[/^ERROR: model API call failed.*$/,"Не удалось обратиться к API рук"],
[/^hands returned no ### FILE blocks.*$/,"Руки не вернули ни одного файла (блоки ### FILE)"],[/^no brain reply waiting.*$/,"Нет ответа мозга для рук"],
[/^Failed to fetch$/,"Нет связи с локальным сервером"]];
const RS=[[/reply must contain the heading lines PLAN, HANDS TASK, STATUS.*/,"в ответе должны быть строки-заголовки PLAN, HANDS TASK, STATUS"],[/HANDS TASK is empty/,"раздел HANDS TASK пустой"],[/STATUS must be CONTINUE or DONE/,"в STATUS должно быть CONTINUE или DONE"]];
function tr(m){m=String(m||"");if(/^REJECTED:/.test(m))for(const[r,t]of RS)m=m.replace(r,t);for(const[r,t]of TR){if(r.test(m))return m.replace(r,t)}return m}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,b)=>fetch(p,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-Lumus-UI":"1"},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j});
const ls={get(k,d){try{const v=localStorage.getItem("lumus."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("lumus."+k,JSON.stringify(v))}catch(e){}}};
let S=null,D={cmd:"",note:""},view="auto",local=null,lastSig="",openSet=new Set(),tab=0,modalOpen=false,narrowSide=false;
let P={theme:ls.get("theme","dark"),sys:ls.get("sys",false),anim:ls.get("anim",true),confirm:ls.get("confirm",true),manual:ls.get("manual",false),adapter:ls.get("adapter","chatgpt"),cmd:ls.get("cmd",""),dir:ls.get("dir",""),rounds:ls.get("rounds",5)};
const savep=()=>Object.keys(P).forEach(k=>ls.set(k,P[k]));
function effTheme(){return P.sys?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):P.theme}
function applyTheme(){const t=effTheme();document.body.className="t-"+t+(P.anim?"":" noanim");document.documentElement.dataset.t=t}
function toast(m){const e=$("#toast");e.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>e.innerHTML="",2600)}
const PHASE={"need-brain":"мозг","need-hands":"руки","need-test":"тесты"};
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?openSet.add(k):openSet.delete(k)}},true);
const det=(k,t,b)=>b?`<details data-k="${k}" ${openSet.has(k)?"open":""}><summary>${t}</summary><pre>${esc(b)}</pre></details>`:"";
const chipH=(c,t)=>`<span class="chip ${c}"><i></i>${esc(t)}</span>`;
function seg(){const n=[["dark","Космос","#7aa2ff"],["light","Светлая","#f5b942"],["min","Минимал","#8a8a8a"]];const cur=effTheme();return '<div class="seg">'+n.map(([k,l,c])=>`<span class="${cur===k?"on":""}" data-theme="${k}"><span class="sw" style="background:${c}"></span>${l}</span>`).join("")+'</div>'}
function chatsList(){return ls.get("chats",[])}
function addChat(title){const a=chatsList().filter(c=>c.title!==title);a.unshift({title,ts:Date.now()});ls.set("chats",a.slice(0,40))}
function groupName(ts){const d=new Date(ts),n=new Date();const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();const df=Math.round((day(n)-day(d))/864e5);return df<=0?"Сегодня":df===1?"Вчера":"Раньше"}
let q="";
function sideH(){
 const L=chatsList().filter(c=>!q||c.title.toLowerCase().includes(q.toLowerCase()));const g={};L.forEach(c=>(g[groupName(c.ts)]=g[groupName(c.ts)]||[]).push(c));
 let h='<div class="logo"><div class="mark">✦</div>Lumus Code</div><button class="nb" id="newChat">＋ Новый чат</button><input class="srch" id="srch" placeholder="⌕  Поиск по чатам" value="'+esc(q)+'" style="border:0;outline:0;color:var(--tx)">';
 if(!L.length)h+='<div class="mut small" style="padding:10px 6px">Здесь появятся твои прошлые задачи. Нажми на задачу, чтобы повторить её.</div>';
 for(const gn of ["Сегодня","Вчера","Раньше"])if(g[gn]){h+='<div class="grp">'+gn+'</div>';g[gn].forEach((c,i)=>h+=`<div class="ci" data-chat="${esc(c.title)}" title="${esc(c.title)}">${esc(c.title)}</div>`)}
 const key=S&&S.hands.key_set;
 h+='<div class="sidefoot">'+seg()+`<div class="me"><div class="av ai">М</div><div style="min-width:0"><b>Локально</b><div class="mut small">${key?"ключ рук задан · бесплатные модели":"ключа рук нет — задай в ⚙"}</div></div><button class="ib" id="openSet" style="margin-left:auto" title="Настройки">⚙</button></div></div>`;
 return h}
function barH(){
 const title=view==="new"||!S||!S.initialized?"Новый чат":(S.task||"").trim().split("\n")[0].slice(0,60)||"Чат";
 let st="";
 if(S&&S.initialized&&view!=="new"){st=S.busy?chipH("run","работаю: "+(PHASE[S.phase]||"")):S.pending?chipH("warn","ждёт тебя"):S.result?chipH(/PASSED/.test(S.result)?"ok":"bad","завершено"):S.manual&&S.phase==="need-brain"?chipH("warn","ждём ответ мозга"):chipH("",S.error?"остановлено":"пауза")}
 return `<div class="bar"><button class="ib menu" id="menu">☰</button><div class="ttl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(title)}</div><span class="chip hide-n"><i></i>Мозг: ${P.manual?"вручную":S&&S.adapter==="gemini"?"Gemini":"ChatGPT"}</span><span class="chip hide-n" id="chipHands" title="Сменить провайдера или модель"><i></i>Руки: ${esc((S&&S.hands.provider?S.hands.provider+" · ":"")+((S&&S.hands.model)||"–"))}</span><span class="sp"></span>${st}<span class="chip ok hide-n"><i></i>на этом компьютере</span></div>`}
function compH(){
 const busy=S&&S.busy,cmd=P.cmd||D.cmd;
 return `<div class="comp"><div class="col" style="padding:0"><div class="cbox"><textarea class="cin" id="cin" rows="1" placeholder="${busy?"Идёт работа. Можно нажать «Стоп»":"Напиши, что сделать, или опиши задачу…"}"></textarea><div class="ctl"><button class="ib" id="addbtn" title="Папка и проверка">＋</button><button class="chip btnlike" id="tgManual">${P.manual?"Мозг вручную":"Авто: мозг + руки"}</button><button class="chip btnlike hide-n" id="tgConf">${P.confirm?"Подтверждать действия":"Без подтверждений"}</button><button class="chip btnlike hide-n" id="tgCmd">Проверка: ${cmd?esc(cmd.length>28?cmd.slice(0,27)+"…":cmd):"не задана"}</button>${busy?'<button class="send" id="stop" title="Стоп">■</button>':'<button class="send" id="send" title="Отправить">↑</button>'}</div></div><div class="note">Lumus Code работает на твоём компьютере (127.0.0.1). Проверяй важные изменения.</div></div></div>`}
function heroH(){
 return `<div class="hero"><div class="mark" style="width:54px;height:54px;font-size:24px;margin-bottom:16px">✦</div><h1>С чего <span class="grad">начнём</span>?</h1><div class="mut">Опиши задачу обычными словами. Сильная модель думает, бесплатная пишет код, тесты проверяют.</div><div class="sug">${[["Написать программу с нуля","Скажи, что нужна, я сделаю и проверю","Напиши калькулятор calc.py с функциями add, sub, mul, div. Тесты уже лежат в tests/."],["Починить упавшие тесты","Найду причину и поправлю файлы","Почини упавшие тесты в этом проекте, не меняя сами тесты."],["Разобраться в проекте","Прочитаю папку и объясню по-простому","Прочитай файлы проекта и сделай короткий README.md: что это и как запускать. Тесты должны проходить."],["Ускорить или почистить код","Покажу изменения до применения","Упрости и почисти код, не ломая тесты."]].map(([a,b,t])=>`<div class="sg" data-fill="${esc(t)}"><b style="font-weight:500">${a}</b><small>${b}</small></div>`).join("")}</div>${D.cmd?"":`<div class="mut small" style="margin-top:16px">Тесты в папке проекта не найдены. Укажи команду проверки (кнопка «Проверка» внизу).</div>`}</div>`}
function userH(t){return `<div class="row-u"><div class="me-b">${esc(t).replace(/\n/g,"<br>")}</div></div>`}
function aiH(inner){return `<div class="msg"><div class="av ai">✦</div><div class="ai-b">${inner}</div></div>`}
function toolH(ic,name,arg,right,body){return `<div class="tool"><div class="th"><div class="ic2">${ic}</div><b>${name}</b><span class="mono mut">${esc(arg||"")}</span><span class="r">${right||""}</span></div>${body?`<div class="tb">${body}</div>`:""}</div>`}
function feedH(){
 if(view==="new"||!S||!S.initialized){ if(local) return '<div class="feed"><div class="col">'+userH(local)+aiH('<p class="mut">Запускаю…</p>')+'</div></div>'; return heroH()}
 let h=userH(S.task.trim());
 const cur=S.round,fin=!!S.result,pass=fin&&/PASSED/.test(S.result);
 let inner=`<p>Понял. Запускаю цикл «мозг + руки»: до ${S.max_rounds} раундов, проверка: <span class="mono">${esc(S.test)}</span>.</p>`;
 const done=(S.rounds||[]).filter(r=>r.exit!=null).length;
 const frac=fin?1:Math.min(.97,(done+(S.phase==="need-hands"?.4:S.phase==="need-test"?.7:S.busy?.15:0))/S.max_rounds);
 let rows="";
 (S.rounds||[]).forEach(r=>{
  const active=r.n===cur&&!fin;
  const brain=r.brain_reply?'<span class="pill b">Мозг ✓</span>':active&&S.phase==="need-brain"?`<span class="pill b">${S.busy?"Мозг думает…":S.manual?"Мозг: ждём ответ":"Мозг ждёт"}</span>`:'<span class="pill">Мозг</span>';
  const hands=r.files.length?'<span class="pill h">Руки ✓</span>':active&&S.phase==="need-hands"?'<span class="pill h">Руки пишут…</span>':'<span class="pill">Руки ждут</span>';
  const test=r.exit===0?'<span class="pill ok">Тесты ✓</span>':r.exit!=null?`<span class="pill bad">Тесты ✕ (код ${r.exit})</span>`:active&&S.phase==="need-test"?'<span class="pill">Тесты идут…</span>':'<span class="pill">Тесты ждут</span>';
  const note=r.exit===0?"Всё прошло.":r.exit!=null?"Тесты упали, вывод ушёл мозгу в следующем раунде.":active&&S.phase==="need-brain"?(S.busy?"Мозг разбирает задачу. Обычно 20–40 секунд.":""):active&&S.phase==="need-hands"?"Руки пишут код.":"";
  rows+=`<div class="rr"><div class="n">Раунд ${r.n}</div><div style="min-width:0">${brain}${hands}${test}<div class="mut small" style="margin-top:4px">${note}</div>${det("p"+r.n,"Запрос мозгу",r.prompt)}${det("b"+r.n,"Ответ мозга",r.brain_reply)}${det("h"+r.n,"Задание рукам",r.hands_task)}</div></div>`});
 inner+=`<div class="rounds"><div class="rtop"><b>◉ Мозг + руки</b>${chipH(fin?(pass?"ok":"bad"):S.busy?"run":"",fin?(pass?"готово":"остановлено"):"раунд "+cur+" из "+S.max_rounds)}<span class="sp"></span><span class="mut small">бесплатно · 0 ₽</span></div><div class="pg"><i style="width:${Math.round(frac*100)}%"></i></div>${rows}</div>`;
 h+=aiH(inner);
 let t2="";
 (S.rounds||[]).forEach(r=>{
  if(r.files.length)t2+=toolH("✎","Руки записали файлы","",'<span class="chip ok"><i></i>раунд '+r.n+"</span>",'<div class="files">'+r.files.map(f=>"<span>"+esc(f)+"</span>").join("")+"</div>");
  if(r.exit!=null)t2+=toolH("▶","Запуск тестов",S.test,r.exit===0?chipH("ok","прошли"):chipH("bad","упали, код "+r.exit),det("t"+r.n,"Вывод тестов",r.test_output));
 });
 if(S.busy&&S.phase==="need-test"&&!S.pending)t2+=toolH("▶","Запуск тестов",S.test,chipH("run","идёт…"));
 if(t2)h+=aiH(t2);
 if(S.pending){const p=S.pending;h+=aiH(`<p>Сейчас нужно выполнить команду на твоём компьютере, поэтому спрашиваю.</p><div class="confirm"><div class="ch"><span style="color:var(--warn)">⚠</span> Подтверди действие<span class="sp"></span>${chipH("warn","ждёт тебя")}</div><div class="cb"><div class="mut small">Lumus Code хочет выполнить в папке ${esc(p.cwd)}:</div><pre>$ ${esc(p.cmd)}</pre><div class="mut small" style="margin-top:8px">Это команда проверки, которую ты задал. Она запустится один раз (раунд ${p.round}).</div><div class="acts"><button class="btn pri sm" data-dec="allow">Разрешить</button><button class="btn sm" data-dec="allow-chat">Разрешить в этом чате</button><button class="btn sm danger" data-dec="deny">Отклонить</button></div></div></div>`)}
 if(S.manual&&S.phase==="need-brain"&&!S.result&&!S.busy&&!S.pending)h+=aiH(`<p>Ручной режим: мозг отвечает вне программы. Скопируй запрос, вставь его в любой веб-чат, потом вставь сюда ответ.</p><div class="tool"><div class="th"><div class="ic2">✎</div><b>Ответ мозга</b></div><div class="tb"><div class="btns" style="margin:8px 0"><button class="btn sm" id="cpPrompt">Скопировать запрос</button></div><textarea id="brainReply" class="input mono" rows="6" placeholder="Вставь ответ мозга (PLAN, HANDS TASK, STATUS)…" style="margin-top:6px"></textarea><div class="btns" style="margin-top:8px"><button class="btn pri sm" id="sendReply">Принять ответ и продолжить</button></div><div id="replyErr"></div></div></div>`);
 if(S.error)h+=aiH(`<div class="errc">${esc(tr(S.error))}</div>`+(S.manual?"":'<div class="mut small">Можно переключиться на ручной режим внизу и продолжить.</div>'));

 else if(!S.busy&&!S.error&&!S.pending&&!(S.manual&&S.phase==="need-brain")&&S.phase)h+=aiH(`<p class="mut">Цикл на паузе.</p><div class="btns"><button class="btn pri sm" id="resume">Продолжить</button></div>`);
 return '<div class="feed" id="feed"><div class="col">'+h+'</div></div>'}


let wiz=null,wizSkip=false;

function wizH(){
 const W=wiz,cat=PV?PV.catalog.concat(PV.connected.map(c=>({id:c.id,name:c.name,hint:"уже подключён",needs_key:c.needs_key,model:c.model,key_url:""}))):[];
